[package]
name = "mod-wayfarer_stones"
version = "0.8.1"
edition = "2024"
license = "MIT"
publish = false
description = "Wayfarer Stones for Horizon: place a stone, activate it, travel between the ones you know."

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build).
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
