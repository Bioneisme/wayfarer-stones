[package]
name = "horizon-mod-wayfarer-stones"
version = "0.6.3"
edition = "2024"
license = "MIT"
publish = false
description = "Wayfarer Stones for Horizon, a native server mod: place a stone, activate it, travel between the ones you know."

# The mod's rules and their tests: the same file the bundle adds to the game
# as `game::wayfarer_stones`. The glue (mixins/wayfarer_stones_native/glue.rs) names game types
# and is compiled only inside Horizon.
[lib]
path = "mixins/wayfarer_stones_native/runtime.rs"

# Both are in Horizon's Cargo.lock, so the staged game builds them too.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
